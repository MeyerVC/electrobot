<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Marisol</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Óptica Marisol</h1>
    </header>
    <p>Bienvenidos a <strong>la óptica</strong> con más de 50 años de experiencia en el cuidado de la vista de nuestra
        ciudad.</p>

    <form id="form-cita" novalidate method="POST" action="procesar.php">

        <div>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div>
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required>
        </div>

        <div>
            <label for="consulta">Contanos qué necesitás</label>
            <textarea id="consulta" name="consulta"></textarea>
        </div>

        <button type="submit">Pedir mi cita</button>
        <p id="aviso-cita" class="aviso"></p>
        <p id="error-pedido"></p>


    </form>
    <footer>
        <p>Parcial 2 Meyer Jhonatan Velasco Churata - 11 de agosto del 2026</p>
    </footer>
    <script src="script.js"></script>
